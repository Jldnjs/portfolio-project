# 프로덕션 배포 시 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always

  backend:
    restart: always
    volumes: []   # bind mount 제거 (소스 이미지 안에 내장됨)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    restart: always
    volumes: []   # bind mount 제거
    environment:
      NODE_ENV: production
